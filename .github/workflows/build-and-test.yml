name: Build and Test

on:
  workflow_dispatch:

jobs:
  build-native:
    name: Build native prebuild (${{ matrix.prebuild }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22"
            prebuild: linux-x64-node-127
          - os: ubuntu-latest
            node-version: "24"
            prebuild: linux-x64-node-137
          - os: windows-latest
            node-version: "22"
            prebuild: win32-x64-node-127
            ffi-prebuild: win32-x64
          - os: windows-latest
            node-version: "24"
            prebuild: win32-x64-node-137
          - os: macos-15-intel
            node-version: "22"
            prebuild: darwin-x64-node-127
          - os: macos-15-intel
            node-version: "24"
            prebuild: darwin-x64-node-137
          - os: macos-latest
            node-version: "22"
            prebuild: darwin-arm64-node-127
          - os: macos-latest
            node-version: "24"
            prebuild: darwin-arm64-node-137
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build native prebuild
        run: bun run build:native
      - name: Upload native prebuild
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.prebuild }}
          path: prebuilds/${{ matrix.prebuild }}/*.node
          if-no-files-found: error
      - name: Upload Windows FFI prebuild
        if: runner.os == 'Windows' && matrix.ffi-prebuild == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.ffi-prebuild }}
          path: prebuilds/${{ matrix.ffi-prebuild }}/*.dll
          if-no-files-found: error

  deno-test:
    name: deno-test (${{ matrix.os }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            prebuild: linux-x64-node-127
          - os: macos-latest
            prebuild: darwin-arm64-node-127
          - os: windows-latest
            prebuild: win32-x64-node-127
            ffi-prebuild: win32-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v1
        with:
          # Pin until Deno 2.8.3's macOS FFI shm_open reopen regression is resolved.
          deno-version: "2.8.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Download native prebuild
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.prebuild }}
          path: prebuilds/${{ matrix.prebuild }}
      - name: Download Windows FFI prebuild
        if: matrix.ffi-prebuild != ''
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.ffi-prebuild }}
          path: prebuilds/${{ matrix.ffi-prebuild }}
      - name: Install Deno dependencies
        run: deno install
      - name: Install npm type dependencies
        run: bun install --frozen-lockfile
      - name: Run Deno tests
        run: npm run test:deno

  runtime-test:
    name: runtime-test (${{ matrix.os }}, ${{ matrix.runtime }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: node
            prebuild: linux-x64-node-127
          - os: macos-latest
            runtime: node
            prebuild: darwin-arm64-node-127
          - os: windows-latest
            runtime: node
            prebuild: win32-x64-node-127
            ffi-prebuild: win32-x64
          - os: ubuntu-latest
            runtime: bun
            prebuild: linux-x64-node-127
          - os: macos-latest
            runtime: bun
            prebuild: darwin-arm64-node-127
          - os: windows-latest
            runtime: bun
            prebuild: win32-x64-node-127
            ffi-prebuild: win32-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install runtime test dependencies
        run: bun install --frozen-lockfile
      - name: Download native prebuild
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.prebuild }}
          path: prebuilds/${{ matrix.prebuild }}
      - name: Download Windows FFI prebuild
        if: matrix.ffi-prebuild != ''
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.ffi-prebuild }}
          path: prebuilds/${{ matrix.ffi-prebuild }}
      - name: Run node:test suite on Node
        if: matrix.runtime == 'node'
        run: node --no-warnings --experimental-transform-types --test "./test/*.test.ts"
      - name: Run Bun test script
        if: matrix.runtime == 'bun'
        run: npm run test:bun

  node-26-ffi-test:
    name: node-26-ffi-test (${{ matrix.os }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            ffi-prebuild: win32-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Download Windows FFI prebuild
        if: matrix.ffi-prebuild != ''
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.ffi-prebuild }}
          path: prebuilds/${{ matrix.ffi-prebuild }}
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Build JavaScript package
        run: npm run build
      - name: Run Node 26 FFI integration
        run: npm run test:node:26
