name: Build Native Prebuilds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Build native prebuild (${{ matrix.prebuild }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22"
            prebuild: linux-x64-node-127
          - os: ubuntu-latest
            node-version: "24"
            prebuild: linux-x64-node-137
          - os: windows-latest
            node-version: "22"
            prebuild: win32-x64-node-127
            ffi-prebuild: win32-x64
          - os: windows-latest
            node-version: "24"
            prebuild: win32-x64-node-137
          - os: macos-15-intel
            node-version: "22"
            prebuild: darwin-x64-node-127
          - os: macos-15-intel
            node-version: "24"
            prebuild: darwin-x64-node-137
          - os: macos-latest
            node-version: "22"
            prebuild: darwin-arm64-node-127
          - os: macos-latest
            node-version: "24"
            prebuild: darwin-arm64-node-137
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build native prebuild
        run: bun run build:native
      - name: Upload native prebuild
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.prebuild }}
          path: prebuilds/${{ matrix.prebuild }}/*.node
          if-no-files-found: error
      - name: Upload Windows FFI prebuild
        if: runner.os == 'Windows' && matrix.ffi-prebuild == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.ffi-prebuild }}
          path: prebuilds/${{ matrix.ffi-prebuild }}/*.dll
          if-no-files-found: error

  commit-prebuilds:
    name: Commit native prebuilds
    runs-on: ubuntu-latest
    needs: build-native
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "2.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - name: Prepare prebuild tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf prebuilds
          mkdir -p prebuilds

          for artifact in native-artifacts/native-*; do
            if [ ! -d "$artifact" ]; then
              continue
            fi

            prebuild="${artifact##*/native-}"
            target="prebuilds/$prebuild"
            mkdir -p "$target"
            find "$artifact" -type f \( -name '*.node' -o -name '*.dll' \) -exec cp '{}' "$target/" ';'

            count="$(find "$target" -maxdepth 1 -type f \( -name '*.node' -o -name '*.dll' \) | wc -l)"
            if [ "$count" -eq 0 ]; then
              echo "::error::No native prebuilds found for $prebuild"
              exit 1
            fi
          done

          find prebuilds -maxdepth 2 -type f \( -name '*.node' -o -name '*.dll' \) | sort
      - name: Check JSR package contents
        run: deno publish --dry-run --allow-dirty
      - name: Commit prebuilds to branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilds

          if git diff --cached --quiet -- prebuilds; then
            echo "No prebuild changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "build: update native prebuilds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed native prebuilds to ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
