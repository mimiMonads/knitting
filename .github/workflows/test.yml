name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deno-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v1
        with:
          # Pin until Deno 2.8.3's macOS FFI shm_open reopen regression is resolved.
          deno-version: "2.8.2"
      - uses: oven-sh/setup-bun@v2
      - name: Install Deno dependencies
        run: deno install
      - name: Install npm type dependencies
        run: bun install --frozen-lockfile
      - name: Run Deno tests
        run: npm run test:deno

  runtime-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: node
          - os: macos-latest
            runtime: node
          - os: windows-latest
            runtime: node
          - os: ubuntu-latest
            runtime: bun
          - os: macos-latest
            runtime: bun
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install runtime test dependencies
        run: bun install --frozen-lockfile
      - name: Run node:test suite on Node
        if: matrix.runtime == 'node'
        run: node --no-warnings --experimental-transform-types --test "./test/*.test.ts"
      - name: Run Bun test script
        if: matrix.runtime == 'bun'
        run: npm run test:bun

  browser-test:
    name: Browser (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Skips itself when the runner image ships no Chromium-family browser.
      - name: Run browser end-to-end checks
        run: npm run test:browser

  node-26-ffi-test:
    name: Node 26 FFI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Build JavaScript package
        run: npm run build
      - name: Run Node 26 FFI integration
        run: npm run test:node:26
